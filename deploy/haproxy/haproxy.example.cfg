global
    log stdout format raw local0
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend app_http
    bind *:8088
    default_backend demo_servers

backend demo_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server primary 192.0.2.11:8000 check inter 2s fall 2 rise 2
    server standby 192.0.2.12:8000 check inter 2s fall 2 rise 2 disabled
